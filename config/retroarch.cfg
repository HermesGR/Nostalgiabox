# Nostalgiabox base configuration

# UI
menu_show_advanced_settings = "false"
menu_show_core_updater = "false"

# Video
video_smooth = "true"
video_scale_integer = "false"

# Audio
audio_latency = "64"

# Saves
savestate_auto_save = "true"
savestate_auto_load = "true"

# Core defaults
libretro_default_core_path = "cores"

# PS1: PCSX-ReARMed uses HLE BIOS when no BIOS file is present.
